<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        *{
            text-align: center;
        }
        .conteiner{
            background-color: aqua;
            display: flex;
            flex-flow: row wrap;
            
        }

        .item{
            background-color: blueviolet;  
            border: 1px solid black; 
            padding: 20px;
            flex-basis: auto;
        }


        div#i1{
            order: 0;
        }

        div#i2{
            order: -2;
        }
        div#i3{
            order: 4;
        }
        div#i4{
            order: 8;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1"> AAAAAAAAAAAAAAAA</div>
        <div class="item" id="i2"> B</div>
        <div class="item" id="i3"> C</div>
        <div class="item" id="i4"> D</div>
        <div class="item" id="i1"> AAAAAAAAAAAAAAAA</div>
        <div class="item" id="i2"> B</div>
        <div class="item" id="i3"> C</div>
        <div class="item" id="i4"> D</div>
    </div>
    
</body>
</html>
